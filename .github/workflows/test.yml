name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      id-token: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew test checkstyleMain pmdMain spotbugsMain

    - name: Find xml files
      run: |
        find ${{ github.workspace }} -name *.xml

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      id: test-results
      if: always()
      with:
        files: "${{ github.workspace }}/**/build/test-results/**/*.xml"

    - name: Set badge color
      shell: bash
      run: |
        case ${{ fromJSON( steps.test-results.outputs.json ).conclusion }} in
          success)
            echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
            ;;
          failure)
            echo "BADGE_COLOR=800000" >> $GITHUB_ENV
            ;;
          neutral)
            echo "BADGE_COLOR=696969" >> $GITHUB_ENV
            ;;
        esac

    - name: Create test badge
      uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8
      with:
        label: Tests
        status: '${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.tests }} tests, ${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs }} runs: ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}'
        color: ${{ env.BADGE_COLOR }}
        path: .github/badges/test.svg

    - name: Add coverage to PR
      id: jacoco
      uses: madrapps/jacoco-report@v1.7.1
      with:
        paths: |
          ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60

    - name: Generate JaCoCo Badge
      id: jacoco-badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        generate-branches-badge: true
        jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv

    - name: Log coverage percentage
      run: |
        echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
        echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

    - name: Commit and push the badges (if it changed)
      uses: EndBug/add-and-commit@v7
      with:
        default_author: github_actions
        message: 'commit badges'
        add: '*.svg'

    - name: Extract pull request number # (commenting on the pull request requires the PR number)
      uses: jwalton/gh-find-current-pr@v1
      id: pr

    - name: Run Autograding
      uses: uhafner/autograding-github-action@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ steps.pr.outputs.number }}
        checks-name: "Autograding GitHub Action"
        config: > # Override default configuration: just grade the test results
          {
            "tests": {
              "name": "Tests",
              "tools": [
                {
                  "id": "test",
                  "name": "Tests",                              
                  "pattern": "${{ github.workspace }}/**/build/test-results/**/*.xml"
                }
              ],
              "passedImpact": 0,
              "skippedImpact": -1,
              "failureImpact": -5,
              "maxScore": 100
            },
            "analysis": [
              {
                "name": "Style",
                "id": "style",
                "tools": [
                  {
                    "id": "checkstyle",
                    "name": "CheckStyle",
                    "pattern": "${{ github.workspace }}/**/build/reports/checkstyle/main.xml"
                  },
                  {
                    "id": "pmd",
                    "name": "PMD",
                    "pattern": "${{ github.workspace }}/**/build/reports/pmd/main.xml"
                  }
                ],
                "errorImpact": -1,
                "highImpact": -1,
                "normalImpact": -1,
                "lowImpact": -1,
                "maxScore": 100
              },
              {
                "name": "Bugs",
                "id": "bugs",
                "icon": "bug",
                "tools": [
                  {
                    "id": "spotbugs",
                    "name": "SpotBugs",
                    "sourcePath": "src/main/java",
                    "pattern": "${{ github.workspace }}/**/build/reports/spotbugs/main.xml"
                  }
                ],
                "errorImpact": -3,
                "highImpact": -3,
                "normalImpact": -3,
                "lowImpact": -3,
                "maxScore": 100
              }
            ],
            "coverage": [
              {
                "name": "Code Coverage",
                "tools": [
                  {
                    "id": "jacoco",
                    "name": "Line Coverage",
                    "metric": "line",
                    "sourcePath": "src/main/java",
                    "pattern": "${{ github.workspace }}/**/build/reports/jacoco/jacocoTestReport.xml"
                  },
                  {
                    "id": "jacoco",
                    "name": "Branch Coverage",
                    "metric": "branch",
                    "sourcePath": "src/main/java",
                    "pattern": "${{ github.workspace }}/**/build/reports/jacoco/jacocoTestReport.xml"
                  }
                ],
                "maxScore": 100,
                "missedPercentageImpact": -1
              }
            ]
          }
